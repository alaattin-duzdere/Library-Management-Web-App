<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - Kütüphane Yönetimi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm border-0 login-card">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Yeni Hesap Oluştur</h3>
                        <form id="register-form">
                            <div id="message-alert" class="alert d-none" role="alert"></div>
                            
                            <div class="mb-3">
                                <label for="username" class="form-label">Kullanıcı Adı</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Adresi</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Şifre</label>
                                <input type="password" class="form-control" id="password" minlength="8" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary" id="register-button">
                                    Kayıt Ol
                                </button>
                            </div>
                        </form>
                        <hr>
                        <div class="text-center">
                            <a href="/login.html">Zaten bir hesabınız var mı? Giriş Yapın</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        // Giriş yapmış kullanıcıyı ana sayfaya yönlendir
        if (Auth.isLoggedIn()) {
            window.location.href = '/index.html';
        }
        
        const registerForm = document.getElementById('register-form');
        const messageAlert = document.getElementById('message-alert');
        const registerButton = document.getElementById('register-button');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageAlert.classList.add('d-none');
            registerButton.disabled = true;
            registerButton.innerText = 'Kayıt Olunuyor...';

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                //
                const response = await Api.register(username, email, password);
                
                if (response.success) {
                    //
                    showMessage('Kayıt başarılı! Lütfen hesabınızı doğrulamak için emailinizi kontrol edin.', 'success');
                    registerForm.reset();
                } else {
                    // Örn: "User with email ... already exists."
                    // Veya "User ... has not verified their account."
                    showMessage(response.message, 'danger');
                }
            } catch (error) {
                console.error('Register error:', error);
                showMessage('Kayıt sırasında bir hata oluştu.', 'danger');
            } finally {
                registerButton.disabled = false;
                registerButton.innerText = 'Kayıt Ol';
            }
        });

        function showMessage(message, type = 'danger') {
            messageAlert.textContent = message;
            messageAlert.className = `alert alert-${type}`;
        }
    </script>
</body>
</html>
