<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Paneli - Kütüphane Yönetimi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="js/auth.js"></script>
    <script>
        if (!Auth.isLoggedIn()) {
            window.location.href = '/login.html';
        } else if (!Auth.hasRole('ADMIN')) {
            alert('Bu sayfaya erişim yetkiniz yok.');
            window.location.href = '/index.html';
        }
    </script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/index.html">Kütüphane</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/index.html">Kitaplar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin.html">Admin Paneli</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logout-button">Çıkış Yap <i class="bi bi-box-arrow-right"></i></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div id="admin-alert" class="alert d-none" role="alert"></div>

        <ul class="nav nav-tabs" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="books-tab" data-bs-toggle="tab" data-bs-target="#books-panel" type="button" role="tab">Kitap Yönetimi</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="authors-tab" data-bs-toggle="tab" data-bs-target="#authors-panel" type="button" role="tab">Yazar Yönetimi</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="categories-tab" data-bs-toggle="tab" data-bs-target="#categories-panel" type="button" role="tab">Kategori Yönetimi</button>
            </li>
        </ul>

        <div class="tab-content" id="adminTabsContent">
            
            <div class="tab-pane fade show active p-3 border border-top-0" id="books-panel" role="tabpanel">
                <h4>Kitap Ekle / Güncelle</h4>
                <form id="book-form">
                    <input type="hidden" id="book-id">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="book-title" class="form-label">Kitap Adı</label>
                            <input type="text" class="form-control" id="book-title" required>
                        </div>
                        <div class="col-md-3">
                            <label for="book-isbn" class="form-label">ISBN</label>
                            <input type="number" class="form-control" id="book-isbn" required>
                        </div>
                        <div class="col-md-3">
                            <label for="book-pages" class="form-label">Sayfa Sayısı</label>
                            <input type="number" class="form-control" id="book-pages" required>
                        </div>
                        <div class="col-md-6">
                            <label for="book-authors" class="form-label">Yazarlar (Ctrl/Cmd ile çoklu seçin)</label>
                            <select multiple class="form-select" id="book-authors" required size="5" disabled>
                                <option>Yükleniyor...</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="book-categories" class="form-label">Kategoriler (Ctrl/Cmd ile çoklu seçin)</label>
                            <select multiple class="form-select" id="book-categories" required size="5" disabled>
                                <option>Yükleniyor...</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">Kitabı Kaydet</button>
                            <button type="reset" class="btn btn-secondary" onclick="document.getElementById('book-id').value = ''">Formu Temizle</button>
                        </div>
                    </div>
                </form>
                <hr>
                <h4>Mevcut Kitaplar</h4>
                <table class="table table-striped table-hover align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Başlık</th> 
                            <th>ISBN</th>
                            <th>Durum</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="books-table-body">
                        </tbody>
                </table>
                
                <nav aria-label="Kitap Sayfalaması" class="mt-3">
                    <ul class="pagination justify-content-center" id="books-pagination">
                        </ul>
                </nav>
            </div>
            
            <div class="tab-pane fade p-3 border border-top-0" id="authors-panel" role="tabpanel">
                <h4>Yazar Ekle / Güncelle</h4>
                <form id="author-form" class="row g-3">
                    <input type="hidden" id="author-id">
                    <div class="col-md-5">
                        <label for="author-firstName" class="form-label">Ad</label>
                        <input type="text" class="form-control" id="author-firstName" required>
                    </div>
                    <div class="col-md-5">
                        <label for="author-lastName" class="form-label">Soyad</label>
                        <input type="text" class="form-control" id="author-lastName" required>
                    </div>
                    <div class="col-md-2 align-self-end">
                        <button type="submit" class="btn btn-primary w-100">Kaydet</button>
                    </div>
                </form>
                <hr>
                <h4>Mevcut Yazarlar</h4>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Ad</th>
                            <th>Soyad</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="authors-table-body">
                        </tbody>
                </table>
            </div>

            <div class="tab-pane fade p-3 border border-top-0" id="categories-panel" role="tabpanel">
                <h4>Kategori Ekle / Güncelle</h4>
                <form id="category-form" class="row g-3">
                    <input type="hidden" id="category-id">
                    <div class="col-md-10">
                        <label for="category-name" class="form-label">Kategori Adı</label>
                        <input type="text" class="form-control" id="category-name" required>
                    </div>
                    <div class="col-md-2 align-self-end">
                        <button type="submit" class="btn btn-primary w-100">Kaydet</button>
                    </div>
                </form>
                <hr>
                <h4>Mevcut Kategoriler</h4>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Kategori Adı</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="categories-table-body">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="imageUploadModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="imageUploadModalLabel">Kitap Resmi Yükle</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="image-upload-form">
                        <input type="hidden" id="upload-book-id">
                        <div class="mb-3">
                            <label for="book-image-file" class="form-label">Dosya seçin (PNG, JPG, GIF)</label>
                            <input class="form-control" type="file" id="book-image-file" accept="image/png, image/jpeg, image/gif" required>
                        </div>
                        <button type="submit" class="btn btn-primary" id="upload-button">Yükle</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        let imageUploadModal = null;
        let currentBookPage = 0;
        const bookPageSize = 10; 
        
        // *** GÜNCELLEME: Select listelerinin yüklenme durumunu takip eden Promise ***
        let selectsLoadingPromise = null;

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('logout-button').addEventListener('click', (e) => {
                e.preventDefault();
                Auth.logout();
            });

            document.getElementById('author-form').addEventListener('submit', handleAuthorFormSubmit);
            document.getElementById('category-form').addEventListener('submit', handleCategoryFormSubmit);
            document.getElementById('book-form').addEventListener('submit', handleBookFormSubmit);
            
            imageUploadModal = new bootstrap.Modal(document.getElementById('imageUploadModal'));
            document.getElementById('image-upload-form').addEventListener('submit', handleImageUploadSubmit);

            loadInitialData();
        });

        const adminAlert = document.getElementById('admin-alert');
        
        function showAlert(message, type = 'danger') {
            adminAlert.textContent = message;
            adminAlert.className = `alert alert-${type}`;
            window.scrollTo(0, 0);
            setTimeout(() => adminAlert.className = 'alert d-none', 5000);
        }

        async function loadInitialData() {
            // *** GÜNCELLEME: Performans İyileştirmesi ***
            // 1. Önce kritik veriyi (Kitap Tablosu) yükle. Await ile bekle.
            await loadBooksTable(currentBookPage);

            // 2. Yazarları ve Kategorileri ARKA PLANDA yüklemeye başla. 
            // 'await' kullanmıyoruz, böylece sayfa donmuyor.
            // Ancak Promise'i bir değişkende saklıyoruz ki 'Düzenle'ye basıldığında bitmesini bekleyebilelim.
            selectsLoadingPromise = populateBookFormSelects();
            
            // 3. Diğer tabloları da arka planda yükle
            loadAuthorsTable();
            loadCategoriesTable();
        }
        
        async function populateBookFormSelects() {
            const authorSelect = document.getElementById('book-authors');
            const categorySelect = document.getElementById('book-categories');
            
            try {
                const [authorRes, categoryRes] = await Promise.all([
                    Api.getAuthors(),
                    Api.getCategories()
                ]);
                
                authorSelect.innerHTML = '';
                if(authorRes.success && authorRes.data) {
                    authorRes.data.forEach(author => {
                        authorSelect.innerHTML += `<option value="${author.id}">${author.firstName} ${author.lastName}</option>`;
                    });
                }
                
                categorySelect.innerHTML = '';
                 if(categoryRes.success && categoryRes.data) {
                    categoryRes.data.forEach(cat => {
                        categorySelect.innerHTML += `<option value="${cat.id}">${cat.categoryName}</option>`;
                    });
                }
                
                // Yükleme bitince disabled kaldır
                authorSelect.disabled = false;
                categorySelect.disabled = false;

            } catch (e) {
                showAlert('Yazar/Kategori listesi yüklenemedi.');
                authorSelect.innerHTML = '<option disabled>Hata oluştu</option>';
                categorySelect.innerHTML = '<option disabled>Hata oluştu</option>';
            }
        }
        
        // --- KİTAP İŞLEMLERİ ---

        async function loadBooksTable(page = 0) {
            const tBody = document.getElementById('books-table-body');
            const paginationEl = document.getElementById('books-pagination');
            
            try {
                const response = await Api.getBooks(page, bookPageSize); 
                
                tBody.innerHTML = '';
                paginationEl.innerHTML = '';

                if (response.success) { 
                    const books = response.data.content || response.data; 
                    const pageInfo = response.data.totalPages ? response.data : null;

                    if (Array.isArray(books)) {
                        books.forEach(book => {
                            const tr = document.createElement('tr');
                            const authorIds = JSON.stringify(book.authors);
                            const categoryIds = JSON.stringify(book.categories);
                            
                            const imageHtml = book.imageUrl
                                ? `<img src="${book.imageUrl}" alt="${book.title}" style="width: 40px; height: 60px; object-fit: cover; border-radius: 4px; margin-right: 10px;">`
                                : `<span style="display: inline-block; width: 40px; height: 60px; background-color: #eee; border-radius: 4px; text-align: center; line-height: 60px; margin-right: 10px;">
                                     <i class="bi bi-image-alt text-muted"></i>
                                   </span>`;

                            tr.innerHTML = `
                                <td>${book.id}</td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        ${imageHtml}
                                        <span>${book.title}</span>
                                    </div>
                                </td>
                                <td>${book.isbn}</td>
                                <td><span class="badge ${book.situation === 'AVAILABLE' ? 'bg-success' : 'bg-danger'}">${book.situation}</span></td>
                                <td>
                                    <button class="btn btn-sm btn-info btn-upload-image" 
                                        data-id="${book.id}" 
                                        data-title="${book.title}"
                                        title="Resim Yükle">
                                        <i class="bi bi-image"></i>
                                    </button>
                                    
                                    <button class="btn btn-sm btn-warning btn-edit-book" 
                                        data-id="${book.id}" 
                                        data-title="${book.title}" 
                                        data-isbn="${book.isbn}" 
                                        data-pages="${book.numberOfPages}"
                                        data-authors='${authorIds}'
                                        data-categories='${categoryIds}'
                                        title="Düzenle">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-danger btn-delete-book" data-id="${book.id}" title="Sil">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            `;
                            tBody.appendChild(tr);
                        });
                    }

                    if (pageInfo) {
                        renderBookPagination(pageInfo);
                        currentBookPage = page;
                    }
                }
                
                document.querySelectorAll('.btn-upload-image').forEach(btn => btn.addEventListener('click', handleOpenUploadModal));
                document.querySelectorAll('.btn-edit-book').forEach(btn => btn.addEventListener('click', handleEditBook));
                document.querySelectorAll('.btn-delete-book').forEach(btn => btn.addEventListener('click', handleDeleteBook));
            } catch (error) {
                showAlert('Kitaplar yüklenirken hata oluştu.');
            }
        }

        function renderBookPagination(pageInfo) {
            const paginationEl = document.getElementById('books-pagination');
            const totalPages = pageInfo.totalPages;
            const current = pageInfo.number; 

            if (totalPages <= 1) return;

            const createPageItem = (pageIndex, label = null, isActive = false, isDisabled = false) => {
                const li = document.createElement('li');
                li.className = `page-item ${isActive ? 'active' : ''} ${isDisabled ? 'disabled' : ''}`;
                const a = document.createElement('a');
                a.className = 'page-link';
                a.href = '#';
                a.innerHTML = label || (pageIndex + 1);
                if (!isDisabled && !isActive) {
                    a.onclick = (e) => { e.preventDefault(); loadBooksTable(pageIndex); };
                }
                li.appendChild(a);
                return li;
            };

            const createEllipsis = () => {
                const li = document.createElement('li');
                li.className = 'page-item disabled';
                li.innerHTML = '<span class="page-link">...</span>';
                return li;
            };

            paginationEl.appendChild(createPageItem(current - 1, '&laquo;', false, pageInfo.first));

            const delta = 2; 
            const left = current - delta;
            const right = current + delta + 1;
            const range = [];
            const rangeWithDots = [];
            let l;

            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= left + 1 && i < right)) {
                    range.push(i);
                }
            }

            for (let i of range) {
                if (l) {
                    if (i - l === 2) {
                        rangeWithDots.push(l + 1);
                    } else if (i - l !== 1) {
                        rangeWithDots.push('...');
                    }
                }
                rangeWithDots.push(i);
                l = i;
            }

            rangeWithDots.forEach(page => {
                if (page === '...') {
                    paginationEl.appendChild(createEllipsis());
                } else {
                    paginationEl.appendChild(createPageItem(page - 1, null, (page - 1) === current));
                }
            });

            paginationEl.appendChild(createPageItem(current + 1, '&raquo;', false, pageInfo.last));
        }

        async function handleBookFormSubmit(e) {
            e.preventDefault();
            
            // *** GÜNCELLEME: Kayıt yapmadan önce listelerin yüklenmesini bekle ***
            // Eğer kullanıcı sayfa açılır açılmaz formu doldurup gönderirse
            if (document.getElementById('book-authors').disabled) {
                await selectsLoadingPromise;
            }

            const id = document.getElementById('book-id').value;
            const authorSelect = document.getElementById('book-authors');
            const selectedAuthors = [...authorSelect.options].filter(o => o.selected).map(o => o.value);
            const categorySelect = document.getElementById('book-categories');
            const selectedCategories = [...categorySelect.options].filter(o => o.selected).map(o => o.value);

            const bookData = {
                title: document.getElementById('book-title').value,
                isbn: document.getElementById('book-isbn').value,
                numberOfPages: document.getElementById('book-pages').value,
                authors: selectedAuthors,
                categories: selectedCategories
            }; 
            
            try {
                let response;
                if (id) {
                    response = await Api.updateBook(id, bookData);
                    if (response.success) showAlert('Kitap başarıyla güncellendi.', 'success');
                } else {
                    response = await Api.createBook(bookData);
                    if (response.success) showAlert('Kitap başarıyla eklendi.', 'success');
                }
                
                if (!response.success) throw new Error(response.message);
                
                document.getElementById('book-form').reset();
                document.getElementById('book-id').value = '';
                loadBooksTable(currentBookPage); 
            } catch (error) {
                showAlert(`İşlem hatası: ${error.message}`);
            }
        }
        
        async function handleEditBook(e) {
            // *** GÜNCELLEME: Düzenlemeye başlamadan önce listelerin yüklenmesini bekle ***
            // Eğer kullanıcı tablo yüklenir yüklenmez "Düzenle"ye basarsa
            if (document.getElementById('book-authors').disabled) {
                // Butona basıldığında biraz bekleme olabilir, kullanıcıya hissettirmek iyi olabilir ama
                // şimdilik sadece bekliyoruz.
                await selectsLoadingPromise;
            }

            const btn = e.currentTarget; 
            const { id, title, isbn, pages, authors, categories } = btn.dataset;

            document.getElementById('book-id').value = id;
            document.getElementById('book-title').value = title;
            document.getElementById('book-isbn').value = isbn;
            document.getElementById('book-pages').value = pages;
            
            const authorIds = JSON.parse(authors);
            [...document.getElementById('book-authors').options].forEach(o => {
                o.selected = authorIds.includes(Number(o.value));
            });
            
            const categoryIds = JSON.parse(categories);
            [...document.getElementById('book-categories').options].forEach(o => {
                o.selected = categoryIds.includes(Number(o.value));
            });
            
            new bootstrap.Tab(document.getElementById('books-tab')).show();
            window.scrollTo(0, 0);
        }

        async function handleDeleteBook(e) {
            const id = e.currentTarget.dataset.id;
            if (confirm(`Kitabı (ID: ${id}) silmek istediğinizden emin misiniz?`)) {
                try {
                    const response = await Api.deleteBook(id);
                    if (response.success) {
                        showAlert('Kitap silindi.', 'success');
                        loadBooksTable(currentBookPage); 
                    } else {
                        showAlert(`Hata: ${response.message}`, 'danger');
                    }
                } catch (error) {
                    showAlert('Kitap silinirken bir hata oluştu.');
                }
            }
        }
        
        // --- Resim Yükleme Fonksiyonları ---
        
        function handleOpenUploadModal(e) {
            const btn = e.currentTarget;
            const { id, title } = btn.dataset;
            document.getElementById('imageUploadModalLabel').textContent = `Resim Yükle: ${title}`;
            document.getElementById('upload-book-id').value = id;
            document.getElementById('image-upload-form').reset();
            imageUploadModal.show();
        }

        async function handleImageUploadSubmit(e) {
            e.preventDefault();
            const bookId = document.getElementById('upload-book-id').value;
            const fileInput = document.getElementById('book-image-file');
            const uploadButton = document.getElementById('upload-button');
            if (!fileInput.files || fileInput.files.length === 0) {
                showAlert('Lütfen bir dosya seçin.', 'warning');
                return;
            }
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file); 
            uploadButton.disabled = true;
            uploadButton.textContent = 'Yükleniyor...';
            try {
                const response = await Api.uploadBookImage(bookId, formData);
                if (response.success) {
                    showAlert('Resim başarıyla yüklendi.', 'success');
                    imageUploadModal.hide();
                    loadBooksTable(currentBookPage); 
                } else {
                    showAlert(`Yükleme hatası: ${response.message}`, 'danger');
                }
            } catch (error) {
                showAlert(`Yükleme hatası: ${error.message}`, 'danger');
            } finally {
                uploadButton.disabled = false;
                uploadButton.textContent = 'Yükle';
            }
        }

        
        // --- YAZAR İŞLEMLERİ (Değişiklik yok) ---
        async function loadAuthorsTable() {
            const tBody = document.getElementById('authors-table-body');
            try {
                const response = await Api.getAuthors();
                tBody.innerHTML = ''; 
                if(response.success && response.data) {
                    response.data.forEach(author => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${author.id}</td>
                            <td>${author.firstName}</td>
                            <td>${author.lastName}</td>
                            <td>
                                <button class="btn btn-sm btn-warning btn-edit-author" data-id="${author.id}" data-first="${author.firstName}" data-last="${author.lastName}"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-danger btn-delete-author" data-id="${author.id}"><i class="bi bi-trash"></i></button>
                            </td>
                        `;
                        tBody.appendChild(tr);
                    });
                }
                document.querySelectorAll('.btn-delete-author').forEach(btn => btn.addEventListener('click', handleDeleteAuthor));
                document.querySelectorAll('.btn-edit-author').forEach(btn => btn.addEventListener('click', handleEditAuthor));
            } catch (error) {
                showAlert('Yazarlar yüklenirken hata oluştu.');
            }
        }
        
        async function handleAuthorFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('author-id').value;
            const firstName = document.getElementById('author-firstName').value;
            const lastName = document.getElementById('author-lastName').value;
            try {
                const response = id 
                    ? await Api.updateAuthor(id, { firstName, lastName })
                    : await Api.createAuthor({ firstName, lastName });
                if (!response.success) throw new Error(response.message);
                showAlert(id ? 'Yazar başarıyla güncellendi.' : 'Yazar başarıyla eklendi.', 'success');
                document.getElementById('author-form').reset();
                document.getElementById('author-id').value = ''; 
                loadAuthorsTable();
                // Yazar eklendiğinde kitap formundaki listeyi güncellememiz gerekir.
                // Bunu da arka planda yapabiliriz.
                populateBookFormSelects(); 
            } catch (error) {
                showAlert(`İşlem sırasında bir hata oluştu: ${error.message}`);
            }
        }
        
        function handleEditAuthor(e) {
            const { id, first, last } = e.currentTarget.dataset;
            document.getElementById('author-id').value = id;
            document.getElementById('author-firstName').value = first;
            document.getElementById('author-lastName').value = last;
            new bootstrap.Tab(document.getElementById('authors-tab')).show();
            window.scrollTo(0, 0);
        }

        async function handleDeleteAuthor(e) {
            const id = e.currentTarget.dataset.id;
            if (confirm(`Yazarı (ID: ${id}) silmek istediğinizden emin misiniz?`)) {
                try {
                    const response = await Api.deleteAuthor(id);
                    if (response.success) {
                        showAlert('Yazar silindi.', 'success');
                        loadAuthorsTable();
                        populateBookFormSelects(); 
                    } else {
                         showAlert(`Hata: ${response.message}`, 'danger');
                    }
                } catch (error) {
                    showAlert('Yazar silinirken bir hata oluştu.');
                }
            }
        }
        
        // --- KATEGORİ İŞLEMLERİ (Değişiklik yok) ---
        
        async function loadCategoriesTable() {
            const tBody = document.getElementById('categories-table-body');
            try {
                const response = await Api.getCategories();
                tBody.innerHTML = '';
                if(response.success && response.data) {
                    response.data.forEach(cat => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${cat.id}</td>
                            <td>${cat.categoryName}</td>
                            <td>
                                <button class="btn btn-sm btn-warning btn-edit-category" data-id="${cat.id}" data-name="${cat.categoryName}"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-danger btn-delete-category" data-id="${cat.id}"><i class="bi bi-trash"></i></button>
                            </td>
                        `;
                        tBody.appendChild(tr);
                    });
                }
                document.querySelectorAll('.btn-delete-category').forEach(btn => btn.addEventListener('click', handleDeleteCategory));
                document.querySelectorAll('.btn-edit-category').forEach(btn => btn.addEventListener('click', handleEditCategory));
            } catch (error) {
                showAlert('Kategoriler yüklenirken hata oluştu.');
            }
        }
        
        async function handleCategoryFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('category-id').value;
            const categoryName = document.getElementById('category-name').value;
            try {
                 const response = id
                    ? await Api.updateCategory(id, { categoryName })
                    : await Api.createCategory({ categoryName });
                if (!response.success) throw new Error(response.message);
                showAlert(id ? 'Kategori başarıyla güncellendi.' : 'Kategori başarıyla eklendi.', 'success');
                document.getElementById('category-form').reset();
                document.getElementById('category-id').value = '';
                loadCategoriesTable();
                populateBookFormSelects(); 
            } catch (error) {
                 showAlert(`İşlem sırasında bir hata oluştu: ${error.message}`);
            }
        }
        
        function handleEditCategory(e) {
            const { id, name } = e.currentTarget.dataset;
            document.getElementById('category-id').value = id;
            document.getElementById('category-name').value = name;
            new bootstrap.Tab(document.getElementById('categories-tab')).show();
            window.scrollTo(0, 0);
        }

        async function handleDeleteCategory(e) {
            const id = e.currentTarget.dataset.id;
            if (confirm(`Kategoriyi (ID: ${id}) silmek istediğinizden emin misiniz?`)) {
                try {
                    const response = await Api.deleteCategory(id);
                     if (response.success) {
                        showAlert('Kategori silindi.', 'success');
                        loadCategoriesTable();
                        populateBookFormSelects(); 
                    } else {
                         showAlert(`Hata: ${response.message}`, 'danger');
                    }
                } catch (error) {
                    showAlert('Kategori silinirken bir hata oluştu.');
                }
            }
        }
    </script>
</body>
</html>
