<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Sıfırla - Kütüphane</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm border-0 login-card">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Yeni Şifre Belirle</h3>
                        
                        <div id="message-alert" class="alert d-none" role="alert"></div>

                        <form id="reset-form">
                            <input type="hidden" id="reset-token">
                            
                            <div class="mb-3">
                                <label for="new-password" class="form-label">Yeni Şifre</label>
                                <input type="password" class="form-control" id="new-password" minlength="8" required>
                            </div>
                            <div class="mb-3">
                                <label for="confirm-password" class="form-label">Yeni Şifre (Tekrar)</label>
                                <input type="password" class="form-control" id="confirm-password" minlength="8" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary" id="reset-button">
                                    Şifreyi Değiştir
                                </button>
                            </div>
                        </form>
                        <hr>
                        <div class="text-center">
                            <a href="/login.html">Giriş Ekranına Dön</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        const resetForm = document.getElementById('reset-form');
        const messageAlert = document.getElementById('message-alert');
        const resetButton = document.getElementById('reset-button');
        const tokenInput = document.getElementById('reset-token');

        document.addEventListener('DOMContentLoaded', () => {
            // 1. URL'den token'ı al
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            if (token) {
                // Token varsa, gizli input'a yerleştir
                tokenInput.value = token;
            } else {
                // Token yoksa, formu gizle ve hata göster
                showError('Geçersiz veya eksik şifre sıfırlama linki.', 'danger');
                resetForm.classList.add('d-none');
            }
        });

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageAlert.classList.add('d-none');
            
            const token = tokenInput.value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Frontend şifre kontrolü
            if (newPassword !== confirmPassword) {
                showError('Şifreler uyuşmuyor.', 'danger');
                return;
            }

            resetButton.disabled = true;
            resetButton.innerText = 'İşleniyor...';

            try {
                // Backend DTO'suna uygun istek
                const response = await Api.resetPassword(token, newPassword, confirmPassword);
                
                if (response.success) {
                    showError('Şifreniz başarıyla değiştirildi! Giriş sayfasına yönlendiriliyorsunuz...', 'success');
                    resetForm.classList.add('d-none');
                    setTimeout(() => window.location.href = '/login.html', 3000);
                } else {
                    // Örn: "Passwords do not match." veya "Token has expired."
                    showError(response.message, 'danger');
                    resetButton.disabled = false;
                    resetButton.innerText = 'Şifreyi Değiştir';
                }
            } catch (error) {
                showError('Şifre sıfırlanırken bir hata oluştu.', 'danger');
                resetButton.disabled = false;
                resetButton.innerText = 'Şifreyi Değiştir';
            }
        });

        function showError(message, type = 'danger') {
            messageAlert.textContent = message;
            messageAlert.className = `alert alert-${type}`;
        }
    </script>
</body>
</html>
