<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kütüphane - Ana Sayfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js"></script>
    <script>
        if (!Auth.isLoggedIn()) {
            window.location.href = '/login.html';
        }
    </script>
    <style>
        .book-card-title {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 3em;
            margin-bottom: 0.5rem;
            line-height: 1.5em;
        }
        
        .filter-container {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            position: relative;
            z-index: 100; 
        }

        .choices__inner {
            background-color: #fff;
            border-radius: 0.375rem;
            min-height: 38px;
            border: 1px solid #dee2e6;
        }
        
        .choices__list--dropdown {
            z-index: 10000 !important;
            word-break: break-word;
        }
        
        .choices__list--dropdown .choices__list {
            max-height: 250px;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/index.html">Kütüphane</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="navbar-text text-white me-3" id="welcome-message"></span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/index.html">Kitaplar</a>
                    </li>
                    <li class="nav-item d-none" id="admin-link">
                        <a class="nav-link" href="/admin.html">Admin Paneli</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logout-button">Çıkış Yap <i class="bi bi-box-arrow-right"></i></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div id="action-alert" class="alert d-none" role="alert"></div>

        <div class="row">
            <div class="col-lg-3 mb-4">
                <div class="card mb-4 shadow-sm">
                    <div class="card-header bg-warning text-dark fw-bold"><i class="bi bi-exclamation-triangle"></i> Cezalarım</div>
                    <div id="penalties-loading" class="text-center p-3"><div class="spinner-border spinner-border-sm"></div></div>
                    <ul class="list-group list-group-flush" id="penalties-list"></ul>
                </div>

                <div class="card shadow-sm">
                    <div class="card-header bg-info text-white fw-bold"><i class="bi bi-book"></i> Elimdeki Kitaplar</div>
                    <div id="borrowings-loading" class="text-center p-3"><div class="spinner-border spinner-border-sm"></div></div>
                    <ul class="list-group list-group-flush" id="borrowings-list"></ul>
                </div>
            </div>

            <div class="col-lg-9">
                
                <div class="filter-container shadow-sm border">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-5">
                            <label for="search-books" class="form-label fw-bold text-secondary small">Kitap Ara</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                                <input type="text" id="search-books" class="form-control" placeholder="Başlık, ISBN...">
                            </div>
                        </div>
                        
                        <div class="col-md-3">
                            <label for="filter-category" class="form-label fw-bold text-secondary small">Kategori</label>
                            <select class="form-control" id="filter-category"></select>
                        </div>

                        <div class="col-md-3">
                            <label for="filter-author" class="form-label fw-bold text-secondary small">Yazar</label>
                            <select class="form-control" id="filter-author"></select>
                        </div>
                        
                        <div class="col-md-1">
                            <button class="btn btn-outline-secondary w-100" id="btn-clear-filters" title="Filtreleri Temizle">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <div id="books-loading" class="text-center p-5">
                    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
                </div>

                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-4" id="books-grid"></div>

                <nav aria-label="Kitap Sayfalaması" class="mt-5 mb-5">
                    <ul class="pagination justify-content-center" id="pagination-controls"></ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <script src="js/api.js"></script>
    
    <script>
        let CURRENT_USER_ID = null;
        
        const urlParams = new URLSearchParams(window.location.search);
        let currentPage = parseInt(urlParams.get('page')) || 0;
        let currentSearchQuery = urlParams.get('search') || "";
        let currentCategoryId = urlParams.get('categoryId') || "";
        let currentAuthorId = urlParams.get('authorId') || "";
        
        const pageSize = 12; 
        
        let authorChoices = null, categoryChoices = null;
        let authorDropdownPage = 0, categoryDropdownPage = 0;
        let authorSearchTerm = "", categorySearchTerm = "";
        let isAuthorLoading = false, isCategoryLoading = false;

        const debounce = (func, wait) => {
            let timeout;
            return function(...args) {
                const context = this;
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(context, args), wait);
            };
        };

        document.addEventListener('DOMContentLoaded', () => {
            setupNavbar();
            
            if(currentSearchQuery) document.getElementById('search-books').value = currentSearchQuery;
            
            initChoices();
            populateInitialSelects();

            document.getElementById('search-books').addEventListener('input', debounce((e) => {
                const newSearch = e.target.value.trim();
                if (newSearch !== currentSearchQuery) {
                    loadBooks(0, newSearch, currentCategoryId, currentAuthorId); 
                }
            }, 500));
            
            document.getElementById('btn-clear-filters').addEventListener('click', () => {
                document.getElementById('search-books').value = "";
                if(authorChoices) authorChoices.removeActiveItems();
                if(categoryChoices) categoryChoices.removeActiveItems();
                loadBooks(0, "", "", "");
            });

            if(CURRENT_USER_ID) {
                loadAllData();
            }
        });
        
        function initChoices() {
            categoryChoices = new Choices('#filter-category', {
                removeItemButton: true, searchEnabled: true, searchChoices: false,
                placeholder: true, placeholderValue: 'Kategori seçin...', itemSelectText: '',
                shouldSort: false, renderChoiceLimit: -1, loadingText: 'Yükleniyor...'
            });

            categoryChoices.passedElement.element.addEventListener('search', debounce(async (event) => {
                const val = event.detail.value; if (val === categorySearchTerm) return;
                categorySearchTerm = val; categoryDropdownPage = 0;
                if(val.length < 2) return;
                try {
                    const res = await Api.getCategories(0, 20, val);
                    if (res.success) {
                        const items = (res.data.content || []).map(c => ({ value: c.id, label: c.categoryName }));
                        categoryChoices.setChoices(items, 'value', 'label', true);
                    }
                } catch (e) {}
            }, 500));

            categoryChoices.passedElement.element.addEventListener('showDropdown', () => {
                const list = categoryChoices.dropdown.element.querySelector('.choices__list');
                if(list && !list.hasAttribute('data-scroll')) {
                    list.setAttribute('data-scroll', 'true');
                    list.addEventListener('scroll', async (e) => {
                        if (list.scrollTop + list.clientHeight >= list.scrollHeight - 100 && !isCategoryLoading) {
                            isCategoryLoading = true;
                            const currentScrollPos = list.scrollTop;
                            categoryDropdownPage++;
                            try {
                                const res = await Api.getCategories(categoryDropdownPage, 20, categorySearchTerm);
                                if(res.success && res.data.content.length > 0) {
                                    const items = res.data.content.map(c => ({ value: c.id, label: c.categoryName }));
                                    categoryChoices.setChoices(items, 'value', 'label', false);
                                    requestAnimationFrame(() => { list.scrollTop = currentScrollPos; });
                                }
                            } catch(e){} finally { setTimeout(() => { isCategoryLoading = false; }, 200); }
                        }
                    });
                }
            });
            
            categoryChoices.passedElement.element.addEventListener('change', (event) => {
                const newVal = event.detail.value;
                loadBooks(0, document.getElementById('search-books').value, newVal, currentAuthorId);
            });

            authorChoices = new Choices('#filter-author', {
                removeItemButton: true, searchEnabled: true, searchChoices: false,
                placeholder: true, placeholderValue: 'Yazar seçin...', itemSelectText: '',
                shouldSort: false, renderChoiceLimit: -1, loadingText: 'Yükleniyor...'
            });

            authorChoices.passedElement.element.addEventListener('search', debounce(async (event) => {
                const val = event.detail.value; if (val === authorSearchTerm) return;
                authorSearchTerm = val; authorDropdownPage = 0;
                if(val.length < 2) return;
                try {
                    const res = await Api.getAuthors(0, 20, val);
                    if (res.success) {
                        const items = (res.data.content || []).map(a => ({ value: a.id, label: `${a.firstName} ${a.lastName}` }));
                        authorChoices.setChoices(items, 'value', 'label', true);
                    }
                } catch (e) {}
            }, 500));

            authorChoices.passedElement.element.addEventListener('showDropdown', () => {
                const list = authorChoices.dropdown.element.querySelector('.choices__list');
                if(list && !list.hasAttribute('data-scroll')) {
                    list.setAttribute('data-scroll', 'true');
                    list.addEventListener('scroll', async (e) => {
                        if (list.scrollTop + list.clientHeight >= list.scrollHeight - 100 && !isAuthorLoading) {
                            isAuthorLoading = true;
                            const currentScrollPos = list.scrollTop;
                            authorDropdownPage++;
                            try {
                                const res = await Api.getAuthors(authorDropdownPage, 20, authorSearchTerm);
                                if(res.success && res.data.content.length > 0) {
                                    const items = res.data.content.map(a => ({ value: a.id, label: `${a.firstName} ${a.lastName}` }));
                                    authorChoices.setChoices(items, 'value', 'label', false);
                                    requestAnimationFrame(() => { list.scrollTop = currentScrollPos; });
                                }
                            } catch(e){} finally { setTimeout(() => { isAuthorLoading = false; }, 200); }
                        }
                    });
                }
            });

            authorChoices.passedElement.element.addEventListener('change', (event) => {
                const newVal = event.detail.value;
                loadBooks(0, document.getElementById('search-books').value, currentCategoryId, newVal);
            });
        }

        async function populateInitialSelects() {
            try {
                const [catRes, authRes] = await Promise.all([
                    Api.getCategories(0, 50), 
                    Api.getAuthors(0, 50)
                ]);
                if (catRes.success) {
                    const items = (catRes.data.content || []).map(c => ({ value: c.id, label: c.categoryName, selected: c.id == currentCategoryId }));
                    categoryChoices.setChoices(items, 'value', 'label', true);
                }
                if (authRes.success) {
                    const items = (authRes.data.content || []).map(a => ({ value: a.id, label: `${a.firstName} ${a.lastName}`, selected: a.id == currentAuthorId }));
                    authorChoices.setChoices(items, 'value', 'label', true);
                }
            } catch (error) { console.error("Filtreler yüklenirken hata:", error); }
        }
        
        window.addEventListener('popstate', (event) => {
            const params = new URLSearchParams(window.location.search);
            loadBooks(parseInt(params.get('page'))||0, params.get('search')||"", params.get('categoryId')||"", params.get('authorId')||"", false);
        });

        function setupNavbar() {
            const userInfo = Auth.getUserInfo();
            if (userInfo) {
                CURRENT_USER_ID = userInfo.userId;
                document.getElementById('welcome-message').textContent = `Hoşgeldin, ${userInfo.username}`;
                if (Auth.hasRole('ADMIN')) {
                    document.getElementById('admin-link').classList.remove('d-none');
                }
            } else { Auth.logout(); }
            document.getElementById('logout-button').addEventListener('click', (e) => { e.preventDefault(); Auth.logout(); });
        }

        function loadAllData() {
            loadBooks(currentPage, currentSearchQuery, currentCategoryId, currentAuthorId); 
            loadMyBorrowings();
            loadMyPenalties();
        }
        
        function showAlert(message, type = 'danger') {
            const alertEl = document.getElementById('action-alert');
            alertEl.textContent = message;
            alertEl.className = `alert alert-${type}`;
            window.scrollTo(0, 0);
            setTimeout(() => alertEl.className = 'alert d-none', 5000);
        }

        async function loadBooks(page, search = "", categoryId = "", authorId = "", updateUrl = true) {
            const gridEl = document.getElementById('books-grid');
            const loadingEl = document.getElementById('books-loading');
            const paginationEl = document.getElementById('pagination-controls');
            gridEl.style.opacity = '0.5'; 
            try {
                if (updateUrl) {
                    const newUrl = new URL(window.location);
                    newUrl.searchParams.set('page', page);
                    if (search) newUrl.searchParams.set('search', search); else newUrl.searchParams.delete('search');
                    if (categoryId) newUrl.searchParams.set('categoryId', categoryId); else newUrl.searchParams.delete('categoryId');
                    if (authorId) newUrl.searchParams.set('authorId', authorId); else newUrl.searchParams.delete('authorId');
                    window.history.pushState({}, '', newUrl);
                    currentPage = page; currentSearchQuery = search; currentCategoryId = categoryId; currentAuthorId = authorId;
                }

                const response = await Api.getBooks(page, pageSize, search, categoryId, authorId);
                gridEl.innerHTML = ''; paginationEl.innerHTML = ''; gridEl.style.opacity = '1';

                if (response.success) {
                    const books = response.data.content || response.data; 
                    const pageInfo = response.data.totalPages ? response.data : null;

                    if (Array.isArray(books) && books.length > 0) {
                        books.forEach(book => {
                            gridEl.appendChild(createBookCard(book));
                        });
                        
                        // NOT: checkLikesForBooks çağrısını kaldırdık (Sadece görüntüleme)

                        if (pageInfo) renderPagination(pageInfo);
                    } else {
                        gridEl.innerHTML = `<div class="col-12 text-center mt-5"><div class="text-muted mb-3"><i class="bi bi-journal-x display-1"></i></div><h4 class="text-muted">Kitap Bulunamadı</h4><p class="text-secondary">Arama kriterlerinizi değiştirerek tekrar deneyin.</p></div>`;
                    }
                } else {
                     showAlert(`Kitaplar yüklenemedi: ${response.message}`, 'danger');
                }
            } catch (error) {
                showAlert(`Hata: ${error.message}`, 'danger');
                gridEl.style.opacity = '1';
            } finally {
                loadingEl.classList.add('d-none');
            }
        }

        // --- GÜNCELLENMİŞ: Daha Şık Kitap Kartı ---
        function createBookCard(book) {
            const col = document.createElement('div');
            col.className = 'col';
            const isAvailable = book.situation === 'AVAILABLE';
            const detailUrl = `/book-detail.html?id=${book.id}`;
            // Eğer resim yoksa placeholder kullan
            const imageUrl = book.imageUrl || 'https://placehold.co/400x600?text=Kapak+Yok';
            const likeCount = book.likeCount || 0;

            col.innerHTML = `
                <div class="card h-100 shadow-sm border-0 book-card-hover">
                     <a href="${detailUrl}" class="position-relative overflow-hidden d-block">
                        <img src="${imageUrl}" class="card-img-top" alt="${book.title}" style="height: 300px; object-fit: cover; transition: transform 0.3s;">
                    </a>
                    <div class="card-body d-flex flex-column p-3">
                        <h5 class="card-title book-card-title" title="${book.title}">
                            <a href="${detailUrl}" class="text-decoration-none text-dark fw-semibold stretched-link">${book.title}</a>
                        </h5>
                        
                        <div class="mt-auto">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="badge rounded-pill ${isAvailable ? 'bg-success' : 'bg-danger'} px-3">
                                    ${isAvailable ? 'Mevcut' : 'Ödünçte'}
                                </span>

                                <div class="d-flex align-items-center bg-light px-2 py-1 rounded border" title="${likeCount} kişi beğendi">
                                    <i class="bi bi-heart-fill text-danger me-1"></i>
                                    <span class="small fw-bold text-secondary">${likeCount}</span>
                                </div>
                            </div>

                            <button class="btn btn-outline-primary btn-sm w-100 position-relative z-2 btn-borrow" 
                                    data-book-id="${book.id}" 
                                    ${!isAvailable ? 'disabled' : ''}>
                                ${isAvailable ? 'Ödünç Al' : 'İncele'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            // Tıklama Olayları
            if(isAvailable) {
                col.querySelector('.btn-borrow').addEventListener('click', (e) => {
                    e.preventDefault();
                    // Kartın kendisine tıklanmasını engelle (stopPropagation)
                    e.stopPropagation(); 
                    handleBorrowBook(e);
                });
            } else {
                col.querySelector('.btn-borrow').addEventListener('click', (e) => {
                     // İncele butonu detay sayfasına götürsün
                     e.preventDefault();
                     window.location.href = detailUrl;
                });
            }
            return col;
        }

        function renderPagination(pageInfo) {
    const paginationEl = document.getElementById('pagination-controls');
    const totalPages = pageInfo.totalPages;
    const current = pageInfo.number;

    paginationEl.innerHTML = ''; // Önce temizle

    if (totalPages <= 1) return;

    // --- DÜZELTME BURADA YAPILDI ---
    // 'pageIdx' argüman adı ile içeride kullanılan değişkenler eşitlendi.
    const createItem = (pageIdx, label, isActive, isDisabled) => {
        const li = document.createElement('li');
        li.className = `page-item ${isActive ? 'active' : ''} ${isDisabled ? 'disabled' : ''}`;
        
        const a = document.createElement('a'); 
        a.className = 'page-link'; 
        a.href = '#'; 
        // HATA BURADAYDI: pageIndex yerine pageIdx kullanıldı
        a.innerHTML = label || (pageIdx + 1); 

        if (!isDisabled && !isActive) {
            a.onclick = (e) => { 
                e.preventDefault(); 
                // HATA BURADAYDI: pageIndex yerine pageIdx kullanıldı
                loadBooks(pageIdx, currentSearchQuery, currentCategoryId, currentAuthorId); 
            };
        }
        
        li.appendChild(a); 
        return li;
    };

    const createEllipsis = () => { 
        const li = document.createElement('li'); 
        li.className = 'page-item disabled'; 
        li.innerHTML = '<span class="page-link">...</span>'; 
        return li; 
    };

    // Önceki Sayfa Butonu
    paginationEl.appendChild(createItem(current - 1, '«', false, pageInfo.first));

    // Sayfa Aralığı Hesaplama Mantığı
    const delta = 2;
    const left = current - delta;
    const right = current + delta + 1;
    const range = []; 
    let l;

    for (let i = 0; i < totalPages; i++) {
        if (i === 0 || i === totalPages - 1 || (i >= left && i < right)) {
            range.push(i);
        }
    }

    for (let i of range) { 
        if (l) { 
            if (i - l === 2) {
                // Arada tek sayfa varsa numarasını ekle (örn: 1 ... 3 yerine 1, 2, 3)
                paginationEl.appendChild(createItem(l + 1, (l + 2), false, false));
            } else if (i - l !== 1) {
                // Arada çok sayfa varsa ... koy
                paginationEl.appendChild(createEllipsis()); 
            } 
        } 
        paginationEl.appendChild(createItem(i, i + 1, i === current, false)); 
        l = i; 
    }

    // Sonraki Sayfa Butonu
    paginationEl.appendChild(createItem(current + 1, '»', false, pageInfo.last));
}

        async function handleBorrowBook(e) {
            e.stopPropagation(); const bookId = e.target.dataset.bookId;
            if (!confirm(`Bu kitabı (ID: ${bookId}) ödünç almak istediğinizden emin misiniz?`)) return;
            try { const res = await Api.borrowBook(bookId); if(res.success) { showAlert('Kitap başarıyla ödünç alındı.', 'success'); loadAllData(); } else showAlert(res.message); } catch(e) { showAlert('Hata'); }
        }
        async function handleReturnBook(e) {
            if (!confirm(`Bu kitabı iade etmek istediğinizden emin misiniz?`)) return;
            try { const res = await Api.returnBook(e.target.dataset.borrowId); if(res.success) { showAlert('Kitap başarıyla iade edildi.', 'success'); if(res.data.penaltyCost > 0) showAlert(`${res.data.penaltyCost} TL ceza uygulandı!`, 'warning'); loadAllData(); } else showAlert(res.message); } catch(e) { showAlert('Hata'); }
        }
        async function loadMyBorrowings() {
            const listEl = document.getElementById('borrowings-list'); const loadingEl = document.getElementById('borrowings-loading');
            try { const res = await Api.getMyBorrowings(CURRENT_USER_ID); listEl.innerHTML = ''; let h=false;
                if (res.success && res.data.length > 0) { res.data.forEach(i => { if (!i.returnDate) { h=true; const li = document.createElement('li'); li.className = 'list-group-item d-flex justify-content-between align-items-center'; li.innerHTML = `<div><span class="fw-bold small">Kitap ID: ${i.bookId}</span><br><small class="${new Date(i.lastReturnDate)<new Date()?'text-danger':'text-muted'}" style="font-size:0.8em;">Son: ${new Date(i.lastReturnDate).toLocaleDateString()}</small></div><button class="btn btn-outline-warning btn-sm btn-return py-0" style="font-size:0.8em;" data-borrow-id="${i.borrowingId}">İade</button>`; li.querySelector('.btn-return').onclick=handleReturnBook; listEl.appendChild(li); } }); }
                if(!h) listEl.innerHTML = '<li class="list-group-item text-muted small text-center">Ödünç kitap yok.</li>';
            } catch(e) { listEl.innerHTML = '<li class="list-group-item list-group-item-danger small">Hata oluştu.</li>'; } finally { loadingEl.classList.add('d-none'); }
        }
        async function loadMyPenalties() {
            const listEl = document.getElementById('penalties-list'); const loadingEl = document.getElementById('penalties-loading');
            try { const res = await Api.getMyPenalties(); listEl.innerHTML = '';
                if (res.success && res.data.length > 0) {
                    const u = res.data.filter(p => p.stateOfPenalty !== 'PAID'); const p = res.data.filter(p => p.stateOfPenalty === 'PAID');
                    if (u.length > 0) { u.forEach(pen => { const li = document.createElement('li'); li.className = 'list-group-item d-flex justify-content-between align-items-center list-group-item-danger'; li.innerHTML = `<div><span class="fw-bold text-danger small">${pen.amount} TL</span><br><span class="badge bg-danger" style="font-size:0.65em;">ÖDENMEDİ</span></div><button class="btn btn-sm btn-success btn-pay py-0 shadow-sm" data-penalty-id="${pen.penaltyId}" data-amount="${pen.amount}" style="font-size:0.8em;">Öde</button>`; li.querySelector('.btn-pay').onclick=handlePayPenalty; listEl.appendChild(li); }); } else listEl.innerHTML += `<li class="list-group-item text-center text-success bg-light small"><i class="bi bi-check-circle-fill"></i> Borcunuz yok.</li>`;
                    if (p.length > 0) { const d = document.createElement('div'); d.className = 'mt-2 border-top pt-1'; d.innerHTML = `<button class="btn btn-light btn-sm w-100 text-start text-muted collapsed py-1" style="font-size:0.8em;" type="button" data-bs-toggle="collapse" data-bs-target="#paidHistoryCollapse"><i class="bi bi-clock-history me-1"></i> Geçmiş (${p.length}) <i class="bi bi-chevron-down float-end"></i></button><div class="collapse" id="paidHistoryCollapse"><ul class="list-group list-group-flush" id="paid-list-inner"></ul></div>`; listEl.appendChild(d); const il = d.querySelector('#paid-list-inner'); p.forEach(item => { il.innerHTML += `<li class="list-group-item bg-light d-flex justify-content-between align-items-center py-1"><span class="text-muted small">${item.amount} TL</span><span class="badge bg-secondary" style="font-size:0.6em;">ÖDENDİ</span></li>`; }); }
                } else listEl.innerHTML = '<li class="list-group-item text-muted small text-center">Ceza kaydı yok.</li>';
            } catch(e) { listEl.innerHTML = '<li class="list-group-item text-muted small text-center">Ceza kaydı yok.</li>'; } finally { loadingEl.classList.add('d-none'); }
        }
        async function handlePayPenalty(e) { if(!confirm('Ödensin mi?'))return; try{const res=await Api.payPenalty(e.target.dataset.penaltyId, e.target.dataset.amount);if(res.success){showAlert('Ödendi','success');loadMyPenalties();}else showAlert(res.message);}catch(e){showAlert('Hata');} }
    </script>
</body>
</html>
